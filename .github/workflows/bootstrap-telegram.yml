name: Bootstrap Telegram bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for latest Render deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://aura-8bom.onrender.com/api/telegram/health"
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /tmp/telegram-health.json -w '%{http_code}' --max-time 15 "$url" || true)"
            echo "Render health HTTP status: $status (attempt $attempt/30)"
            if [ "$status" = "200" ]; then
              cat /tmp/telegram-health.json
              break
            fi
            sleep 10
          done

      - name: Diagnose Telegram runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 60 "https://aura-8bom.onrender.com/api/telegram/health" || true)"
          if [ -z "$response" ]; then
            echo "Telegram health endpoint did not return a response."
            exit 1
          fi
          echo "$response" | jq '{ok, bot, configured}'
          if echo "$response" | jq -e '.ok == true and .configured == true and .bot == "@myaura1_bot"' >/dev/null; then
            echo "Telegram runtime is reachable and uses the live AURA Render app."
          else
            echo "Telegram runtime is reachable, but bot/app configuration is incomplete."
            exit 1
          fi
