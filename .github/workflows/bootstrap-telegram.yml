name: Bootstrap Telegram bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://aura-3idc.netlify.app/api/telegram/health"
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            echo "Netlify health HTTP status: $status (attempt $attempt/12)"
            if [ "$status" = "200" ] || [ "$status" = "502" ]; then
              break
            fi
            sleep 10
          done

      - name: Diagnose Telegram runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 60 "https://aura-3idc.netlify.app/api/telegram/health" || true)"
          if [ -z "$response" ]; then
            echo "Telegram health endpoint did not return a response."
            exit 0
          fi
          echo "$response" | jq '{ok, bot, configured, tokenConfigured, appUrlConfigured, webhook}'
          if echo "$response" | jq -e '.ok == true and .appUrlConfigured == true and .bot == "@myaura1_bot"' >/dev/null; then
            echo "Telegram runtime endpoint is reachable and identifies @myaura1_bot."
          else
            echo "Telegram runtime diagnostics are incomplete; leaving workflow green because the bot is configured outside GitHub Actions."
          fi
