name: Bootstrap Telegram bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://aura-3idc.netlify.app/api/telegram/health"
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            echo "Netlify health HTTP status: $status (attempt $attempt/12)"
            if [ "$status" = "200" ] || [ "$status" = "502" ]; then
              break
            fi
            sleep 10
          done

      - name: Configure and verify Telegram using Netlify secret
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --fail-with-body --max-time 60 "https://aura-3idc.netlify.app/api/telegram/health")"
          echo "$response" | jq '{ok, bot, configured, tokenConfigured, appUrlConfigured, webhook}'
          echo "$response" | jq -e '.ok == true and .configured == true and .tokenConfigured == true and .appUrlConfigured == true and .webhook.url == "https://aura-3idc.netlify.app/api/telegram/webhook"'
          echo "Telegram bot and webhook are configured."
