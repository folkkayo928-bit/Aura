name: AURA CI
# Main-branch verification workflow
# Keep this workflow on main so every production change is typechecked and built.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.web.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck transaction Edge Functions
        run: deno check --no-config supabase/functions/treasury-health/index.ts supabase/functions/withdrawal-broadcaster/index.ts supabase/functions/deposit-indexer/index.ts supabase/functions/deposit-sweep/index.ts
      - name: Build
        env:
          VITE_SUPABASE_URL: https://rtqcistkoomzmzxzasxc.supabase.co
          # This is a Supabase publishable browser key, not a private service-role secret.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T1aovxbvntCIMc2o91wfrg_rVHBxePq
        run: npm run build
