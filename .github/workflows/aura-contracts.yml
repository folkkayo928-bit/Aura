name: AURA Contracts

on:
  push:
    branches: [main]
    paths: ['contracts/**', 'foundry.toml']
  pull_request:
    paths: ['contracts/**', 'foundry.toml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install OpenZeppelin/openzeppelin-contracts --no-commit
      - run: forge install foundry-rs/forge-std --no-commit
      - run: forge test -vv
